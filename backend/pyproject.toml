[project]
name = "deep-research-backend"
version = "0.1.0"
description = "Deep research backend — FastAPI + LangGraph + Arq"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # LLM / LangChain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "litellm>=1.40",
    # Task queue
    "arq>=0.25",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Auth
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    # Search
    "tavily-python>=0.5",
    # Observability
    "langfuse>=2.40",
    # Config
    "pydantic-settings>=2.2",
    "pydantic>=2.6",
    # Reports
    "weasyprint>=62",
    # HTTP
    "httpx>=0.27",
    "tenacity>=8.2",
    # Logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]