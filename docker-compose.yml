# 仅打包应用。基础设施（Postgres / Redis / Milvus / Langfuse）已在外部运行，
# 通过 .env 中的连接串接入。
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dr_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dr_worker
    command: ["arq", "app.workers.research_worker.WorkerSettings"]
    env_file: .env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dr_frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped